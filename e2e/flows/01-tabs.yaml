appId: host.exp.exponent
---
- tapOn:
    id: tab-index
- assertVisible: "Walker"
- assertVisible: "Your activity"
- takeScreenshot: 01-home

- tapOn:
    id: tab-city
- assertVisible: "My city"
- assertVisible: "An empty lawn, for now"
- takeScreenshot: 01-city-empty

- tapOn:
    id: tab-shop
- assertVisible: "Pack shop"
- assertVisible:
    id: set-card-cozy-downtown
- takeScreenshot: 01-shop

- tapOn:
    id: tab-profile
# The tab keeps its scroll position, so return to the top first.
- scrollUntilVisible:
    element: "Steps history"
    direction: UP
- assertVisible: "Steps history"
- takeScreenshot: 01-profile
- scrollUntilVisible:
    element: "Settings"
    direction: DOWN
- takeScreenshot: 01-profile-collection
- scrollUntilVisible:
    element: "Testing"
    direction: DOWN
- takeScreenshot: 01-profile-settings

- tapOn:
    id: tab-index
