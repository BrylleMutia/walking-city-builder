# Cold-starts Expo Go and loads this project from Metro on the host machine.
# start-app.ps1 maps the host's Metro port into the emulator with adb reverse,
# so the emulator reaches it as localhost.
appId: host.exp.exponent
env:
  # run.ps1 passes the real URL; 8082 is the tests' own Metro.
  METRO_URL: exp://localhost:8082
---
- stopApp

# Right after a force-stop, Android sometimes drops the "open project" link:
# you land on the phone's home screen or Expo Go's own home screen instead.
# So send the link and wait for the app, retrying a couple of times.
- retry:
    maxRetries: 3
    commands:
      - openLink: ${METRO_URL}?__expo_disable_fab=1&__expo_disable_onboarding=1
      # The app's greeting, the first onboarding slide (fresh install), or
      # Expo Go's developer menu covering either.
      # (Not the project name: Expo Go's home screen lists it too.)
      - extendedWaitUntil:
          visible: "Let.s do this|SKIP|Toggle performance monitor"
          timeout: 60000

# Expo Go opens its developer menu on first launch; close it if it's there.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back

# A fresh install (wiped Expo Go data) starts with onboarding.
- runFlow:
    when:
      visible:
        id: onboarding-skip
    file: finish-onboarding.yaml
# The app's tabs, or the Wood popup: while a Modal is up, the screen under it
# is hidden from the accessibility tree, so the tabs can't be seen then.
- extendedWaitUntil:
    visible:
      id: "tab-index|wood-haul-close"
    timeout: 30000
- waitForAnimationToEnd

# Every open shows the Wood popup once 500+ steps synced since it last showed
# (e.g. left over from an earlier run): close it so it can't cover the tabs.
# It appears once the app has synced, which can be a moment after the tabs.
# A caller can pass env KEEP_HAUL: "true" to check the popup itself. (No default
# in this file's env block: that would override the caller's value.)
- runFlow:
    when:
      true: ${typeof KEEP_HAUL === "undefined" || KEEP_HAUL != "true"}
    commands:
      - extendedWaitUntil:
          visible:
            id: wood-haul-close
          timeout: 4000
          optional: true
      - runFlow:
          when:
            visible:
              id: wood-haul-close
          commands:
            - tapOn:
                id: wood-haul-close
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: tab-index
          timeout: 10000
