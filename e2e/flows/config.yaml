# Suite settings. Only the flows at this level run as tests; shared/ holds
# sub-flows they call. Flows run in this order and share app state.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 00-reset
    - 11-notifications
    - 01-tabs
    - 02-steps
    - 03-buy-and-open
    - 04-city-place
    - 05-persistence
    - 08-city-top-view
    - 09-all-packs
    - 10-cities
    - 06-components
    - 07-onboarding
