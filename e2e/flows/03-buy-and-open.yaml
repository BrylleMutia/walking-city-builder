appId: host.exp.exponent
---
- tapOn:
    id: tab-shop
- tapOn:
    id: set-card-cozy-downtown
- assertVisible: "About this set"
- takeScreenshot: 03-set-detail
- tapOn:
    id: buy-pack
    retryTapIfNoChange: false

# Sealed pack
- extendedWaitUntil:
    visible: ".*across the top edge.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 03-pack-sealed

# Tear along the top edge, left to right. The sealed pack spans ~15-85% of the
# width with its top edge at ~26% of the height; the tear strip reaches ~36%.
# While it tears the pack slides down to make room for the flap.
- swipe:
    start: 20%, 29%
    end: 82%, 29%
    duration: 900
- extendedWaitUntil:
    visible: ".*Tap the pack.*"
    timeout: 5000
- takeScreenshot: 03-pack-open

# Swipe back to reseal, then tear again: both directions work.
# Once open, the pack has slid down: its tear strip is now at ~36-47%.
- swipe:
    start: 78%, 41%
    end: 18%, 41%
    duration: 700
- extendedWaitUntil:
    visible: ".*across the top edge.*"
    timeout: 5000
- swipe:
    start: 20%, 29%
    end: 82%, 29%
    duration: 900
- extendedWaitUntil:
    visible: ".*Tap the pack.*"
    timeout: 5000

# Take the cards out and flick through all five.
- tapOn:
    id: booster-pack
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Card 1 of 5.*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 03-card-1
- swipe:
    start: 50%, 50%
    end: 95%, 40%
    duration: 150
- assertVisible: "Card 2 of 5.*"
- tapOn:
    point: 50%, 50%
    retryTapIfNoChange: false
- assertVisible: "Card 3 of 5.*"
- tapOn:
    point: 50%, 50%
    retryTapIfNoChange: false
- assertVisible: "Card 4 of 5.*"
- tapOn:
    point: 50%, 50%
    retryTapIfNoChange: false
- assertVisible: "Card 5 of 5.*"
- waitForAnimationToEnd
- takeScreenshot: 03-card-5
- tapOn:
    point: 50%, 50%
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: pack-done
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 03-summary
- assertVisible:
    id: open-another
- tapOn:
    id: pack-done
    retryTapIfNoChange: false
- assertVisible: "My city"
